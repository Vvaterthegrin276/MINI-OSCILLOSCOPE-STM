; ============================================================================
;  PlatformIO Configuration — Nguồn DC đa năng (STM32F411CEU6 Black Pill)
; ============================================================================
;  Cách dùng: mở THƯ MỤC `firmware/` này bằng VS Code (có cài extension
;  PlatformIO IDE) — PlatformIO sẽ tự:
;    1. Cài platform ststm32 + core Arduino (STM32duino) cho STM32F4
;    2. Cài thư viện màn hình TFT_eSPI theo mục lib_deps bên dưới
;    3. Biên dịch file .ino trong thư mục `nguon_dc_da_nang/` (src_dir)
;  Nạp: bấm nút ➜ (Upload) trên thanh dưới của VS Code, qua ST-Link V2.
;
;  Cấu hình màn hình ST7789 (driver, chân SPI, tần số) đã nằm sẵn trong
;  build_flags bên dưới (USER_SETUP_LOADED) — KHÔNG cần sửa file nào của
;  thư viện. Ai dùng Arduino IDE thì copy file firmware/User_Setup.h đè
;  vào thư mục thư viện, xem docs/05-huong-dan-nap-code.md Cách B.
; ============================================================================

[platformio]
src_dir = nguon_dc_da_nang

[env:blackpill_f411ce]
platform      = ststm32
board         = blackpill_f411ce
framework     = arduino
upload_protocol = stlink
debug_tool    = stlink
monitor_speed = 115200

; Thư viện màn hình — PlatformIO tự tải đúng bản mới khi build lần đầu
lib_deps =
    bodmer/TFT_eSPI

; Tối ưu kích thước như cấu hình Arduino IDE (Smallest)
build_flags =
    -Os
    ; ---- Fix lỗi biên dịch với core STM32duino 4.x (framework 4.30000+) ----
    ; Core mới không còn khai báo hàm ltoa() (TFT_eSPI dùng để in số) trong
    ; chuỗi #include — dòng dưới ép khai báo lại cho mọi file biên dịch.
    ; Nếu bạn dùng core cũ hơn (2.x) và muốn bỏ dòng này thì build vẫn được.
    -include api/itoa.h
    ; ---- Cấu hình TFT_eSPI cho màn ST7789V 2.4" (240x320) của dự án ----
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1          ; không dùng MISO — PA6 được làm chân DC
    -DTFT_MOSI=PA7         ; SDA màn hình
    -DTFT_SCLK=PA5         ; SCL màn hình
    -DTFT_CS=PA4
    -DTFT_DC=PA6
    -DTFT_RST=PB0
    -DTFT_INVERSION_ON     ; ST7789 cần inversion — nếu đỏ/xanh đảo màu thì bỏ dòng này
    -DSPI_FREQUENCY=27000000
    -DLOAD_GLCD            ; font 5x7 mặc định dùng trong firmware
